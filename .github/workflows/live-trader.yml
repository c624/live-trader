name: live-trader

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Force dry-run (no trades) regardless of config"
        type: boolean
        default: false
      loop_minutes:
        description: "Override loop length. Actions only publishes logs when a job ends, so a short run is the only way to see a cycle work."
        type: string
        default: ""

permissions:
  contents: write
  actions: write

# Two loops at once would double-buy and clobber each other's ledger.
concurrency:
  group: live-trader
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx solders websockets

      - name: Fetch state branch
        run: |
          git fetch origin live-state:live-state 2>/dev/null || true
          mkdir -p state
          if git rev-parse --verify live-state >/dev/null 2>&1; then
            git --work-tree=state checkout live-state -- . 2>/dev/null || true
          fi

      - name: Run trading loop
        env:
          STATE_DIR: ${{ github.workspace }}/state
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TRADER_PRIVATE_KEY: ${{ secrets.TRADER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '25' }}
        run: python -m live_trader.src.run_live

      - name: Commit state back
        if: always()
        run: |
          cd state
          git init -q -b live-state
          git config user.name "live-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "live trader loop $(date -u +%FT%TZ)" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-state:live-state

      # GitHub's cron has not fired once on this fresh repo, so the loop
      # sustains itself: each successful run dispatches the next. A failing
      # run breaks the chain (no infinite failure loops); the cron above and
      # a manual dispatch both restart it.
      - name: Chain next loop
        if: success()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live-trader.yml/dispatches" \
            -d '{"ref":"main"}'

      # The cron scheduler proved unreliable for both repos, so this loop
      # doubles as the research lab's heartbeat: when paper-state has not
      # ticked in ~2 hours, fire the paper trader. Skips silently while the
      # paper-state branch does not exist yet.
      - name: Heartbeat the paper trader
        if: success()
        run: |
          last=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/branches/paper-state" \
            | python3 -c "import sys,json,datetime;d=json.load(sys.stdin);print(int(datetime.datetime.fromisoformat(d['commit']['commit']['committer']['date'].replace('Z','+00:00')).timestamp()))" 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          echo "paper-state age: ${age}s"
          if [ "$last" != "0" ] && [ "$age" -gt 6600 ]; then
            curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paper-trader.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
