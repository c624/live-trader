name: live-trader

# Stopped 2026-09-04 on Carter's instruction after the hold-time test: no
# schedule and no self-chain, so nothing runs unless dispatched by hand.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Force dry-run (no trades) regardless of config"
        type: boolean
        default: false
      loop_minutes:
        description: "Override loop length. Actions only publishes logs when a job ends, so a short run is the only way to see a cycle work."
        type: string
        default: ""

permissions:
  contents: write
  actions: write

# Two loops at once would double-buy and clobber each other's ledger.
concurrency:
  group: live-trader
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      # Follow the branch, not the SHA that happened to trigger this run.
      # A self-chaining loop otherwise pins itself to whatever commit was
      # current when the chain started: runs dispatched seven hours after a
      # fix were still executing the code from before it, which made every
      # correction look like it had no effect.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx solders websockets

      - name: Fetch state branch
        run: |
          git fetch origin live-state:live-state 2>/dev/null || true
          mkdir -p state
          if git rev-parse --verify live-state >/dev/null 2>&1; then
            git --work-tree=state checkout live-state -- . 2>/dev/null || true
          fi

      - name: Run trading loop
        env:
          STATE_DIR: ${{ github.workspace }}/state
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TRADER_PRIVATE_KEY: ${{ secrets.TRADER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # X search is paid per read; the loop runs without it when unset.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Empty when no input is given, so the config decides.
          LOOP_MINUTES: ${{ inputs.loop_minutes }}
        run: python -m live_trader.src.run_live

      - name: Commit state back
        if: always()
        run: |
          cd state
          git init -q -b live-state
          git config user.name "live-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "live trader loop $(date -u +%FT%TZ)" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-state:live-state
