# One tiny real round-trip trade (~0.03 SOL -> USDC -> back) through the
# trader's exact execution path. Dispatch-only; run before going live.
name: smoke-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx solders

      - name: Round-trip trade
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TRADER_PRIVATE_KEY: ${{ secrets.TRADER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m live_trader.src.smoke
