# Races GeckoTerminal's listing against the chain itself for the same pools,
# both timed from the pool's own creation timestamp. Read-only: no trades.
name: latency-race

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to race"
        type: string
        default: "20"
      poll_seconds:
        description: "Seconds between polls"
        type: string
        default: "10"
      probe:
        description: "'exec' path timing, 'rpcshop' free-RPC survey, 'ws', 'mints', 'rpc', 'yes'"
        type: string
        default: "no"

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install httpx websockets solders
      - name: Race
        working-directory: latency
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          if [ "${{ inputs.probe }}" = "exec" ]; then
            python -m src.exectime 10
          elif [ "${{ inputs.probe }}" = "rpcshop" ]; then
            python -m src.rpcshop 15
          elif [ "${{ inputs.probe }}" = "ws" ]; then
            python -m src.wswatch "${{ inputs.minutes }}"
          elif [ "${{ inputs.probe }}" = "mints" ]; then
            python -m src.mintwatch "${{ inputs.minutes }}" "${{ inputs.poll_seconds }}"
          elif [ "${{ inputs.probe }}" = "rpc" ]; then
            python -m src.rpccheck
          elif [ "${{ inputs.probe }}" = "yes" ]; then
            python -m src.probe 400
          else
            python -m src.race "${{ inputs.minutes }}" "${{ inputs.poll_seconds }}"
          fi
